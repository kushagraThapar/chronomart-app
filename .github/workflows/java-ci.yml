name: Java backend CI

# Two-stage CI for the Java backend slice (Phase 1):
#
#   1. build      — checkout, JDK 21, Maven cache, `mvn verify` (compile +
#                   unit tests including SmokeTest and the vector-policy
#                   contract tests). Runs on every PR and main push that
#                   touches Java code or shared infra.
#
#   2. smoke      — boots the full docker-compose stack (vNext emulator,
#                   otel-collector, prometheus, grafana, gateway,
#                   java-backend), waits for java-backend `/actuator/health`
#                   to report UP, runs `scripts/dev/check.sh` to assert every
#                   plumbing endpoint responds, then runs the workload-oracle
#                   correctness gate (`scripts/oracle-gate.sh`, verify-register
#                   preset) against the same live stack — failing the job on any
#                   correctness anomaly, with the offline linearizability
#                   analyzer as an independent second opinion. Captures
#                   container logs on failure so we can diagnose remotely.
#
# Path filters keep CI focused: changes to .NET / Python / UI code don't
# trigger this workflow, but anything that can break the Java slice
# (Java sources, gateway code, docker-compose, observability config,
# scripts, this workflow itself) does.

on:
  pull_request:
    paths:
      - 'backends/java/**'
      - 'gateway/**'
      - 'infra/docker/**'
      - 'infra/observability/**'
      - 'infra/workloads/**'
      - 'scripts/dev/**'
      - 'scripts/seed/**'
      - 'scripts/oracle-gate.sh'
      - '.github/workflows/java-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backends/java/**'
      - 'gateway/**'
      - 'infra/docker/**'
      - 'infra/observability/**'
      - 'infra/workloads/**'
      - 'scripts/dev/**'
      - 'scripts/seed/**'
      - 'scripts/oracle-gate.sh'
      - '.github/workflows/java-ci.yml'
  # Allow ad-hoc manual runs from the Actions tab (useful for debugging CI
  # without pushing a commit that touches a path-filtered file).
  workflow_dispatch:

# Least-privilege token: this workflow only reads the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. successive PR pushes).
concurrency:
  group: java-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `verify` runs everything through the verify phase: compile, test-compile,
      # surefire unit tests, jar packaging. No live Cosmos endpoint is required —
      # SmokeTest disables container-init and mocks the Cosmos beans.
      - name: Maven verify
        run: mvn -B -ntp -f backends/java/pom.xml verify

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backends/java/target/surefire-reports
          if-no-files-found: ignore
          retention-days: 7

  smoke:
    name: docker-compose smoke + oracle gate
    runs-on: ubuntu-latest
    # Cold-runner budget: ~5 min image pull (1.5 GB vNext emulator) +
    # ~3 min docker build + ~5.5 min emulator health convergence (start_period 30s
    # + retries 60 × 5s) + ~3 min java-backend health poll + ~1 min check.sh +
    # ~2 min oracle gate (20s verify-register run + poll + offline analyzer) ≈ 20 min.
    # 28 min gives a comfortable buffer for GHA disk-IO variance without being open-ended.
    timeout-minutes: 28
    needs: build
    steps:
      - uses: actions/checkout@v4

      # JDK 21 for the offline linearizability analyzer the oracle gate runs as an
      # independent second opinion (the backend fat jar targets Java 21).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The vNext emulator image is ~1.5GB — let it pull while the gateway and
      # java-backend images are built in parallel.
      - name: Build & start ChronoMart stack
        run: |
          docker compose -f infra/docker/docker-compose.yml up -d --build \
            cosmos-emulator otel-collector prometheus grafana gateway java-backend

      - name: Wait for java-backend /actuator/health UP
        # vNext emulator typically becomes healthy within 30s; the java-backend
        # then waits on it and boots in another ~10s. 3-minute budget is
        # generous to cover GH Actions disk-IO variance and image pulls.
        run: |
          set -e
          for i in $(seq 1 60); do
            status=$(curl -fsS http://localhost:8101/actuator/health 2>/dev/null \
              | python3 -c 'import sys,json; print(json.load(sys.stdin).get("status",""))' \
              2>/dev/null || true)
            if [ "$status" = "UP" ]; then
              echo "java-backend reports UP (after ${i} attempts, ~$((i * 3))s)"
              exit 0
            fi
            sleep 3
          done
          echo "::error::java-backend did not report UP within budget"
          exit 1

      - name: Run check script
        run: IMPLEMENTED_SDKS=java bash scripts/dev/check.sh

      # Correctness gate: run the verification oracle against the live gateway and
      # FAIL the job on any ERROR-severity anomaly. Reuses the already-healthy stack
      # from the smoke checks above — no second emulator boot. The gate's defaults
      # already target this stack: BASE http://localhost:8000/api/v1 (gateway) with
      # `X-Cosmos-SDK: java`, preset infra/workloads/verify-register.json, THRESHOLD 0.
      # ANALYZER_JAR adds the offline linearizability analyzer as an independent
      # second opinion, so a green gate means the live oracle AND the offline
      # re-derivation both agree the op history is anomaly-free.
      - name: Oracle correctness gate (verify-register)
        run: |
          docker cp cm-java:/app/app.jar oracle-analyzer.jar
          ANALYZER_JAR="$PWD/oracle-analyzer.jar" bash scripts/oracle-gate.sh

      - name: Capture container logs on failure
        if: failure()
        run: |
          mkdir -p logs-capture
          for svc in cosmos-emulator otel-collector prometheus grafana gateway java-backend; do
            docker compose -f infra/docker/docker-compose.yml logs --no-color "$svc" \
              > "logs-capture/${svc}.log" 2>&1 || true
          done

      - name: Upload container logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: container-logs
          path: logs-capture
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down stack
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml down -v
