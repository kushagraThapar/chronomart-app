server:
  port: 8101
  shutdown: graceful

spring:
  application:
    name: chronomart-java
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    com.chronomart: DEBUG
    com.azure.cosmos: INFO
  file:
    name: ${CHRONOMART_LOG_FILE:logs/chronomart-java.log}
  logback:
    rollingpolicy:
      file-name-pattern: ${CHRONOMART_LOG_FILE:logs/chronomart-java.log}.%d{yyyy-MM-dd}.%i.gz
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB

chronomart:
  build:
    version: ${project.version:0.1.0-SNAPSHOT}
  cosmos:
    endpoint: ${COSMOS_ENDPOINT:https://localhost:8081/}
    key: ${COSMOS_KEY:C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==}
    database: ${COSMOS_DATABASE:ChronoMart}
    auth-mode: ${COSMOS_AUTH_MODE:key}
    allow-invalid-certs: ${COSMOS_ALLOW_INVALID_CERTS:false}
    emulator-host: ${COSMOS_EMULATOR_HOST:}
    container-init:
      enabled: ${CHRONOMART_CONTAINER_INIT_ENABLED:true}
      create-vector-container: ${CHRONOMART_CONTAINER_INIT_VECTOR:false}
