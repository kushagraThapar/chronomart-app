server:
  port: 8101
  shutdown: graceful

spring:
  application:
    name: chronomart-java
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  # Enable histogram buckets for Spring's http.server.requests timer so dashboards
  # can compute histogram_quantile() for p50/p95/p99 latency. Without this Spring
  # only emits seconds_count / seconds_sum / seconds_max (summary form) — no bucket
  # series — and PromQL histogram_quantile() returns no data. The Cosmos SDK timer
  # already emits buckets natively; this only affects Spring's request timer.
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # OTLP push of the same Micrometer registry to the OTel Collector. This is strictly
  # additive to the Prometheus scrape — both paths emit the same metrics; PR9
  # documents this and Phase-5 (Rust/Go onboarding) is the right time to consolidate
  # to OTLP-only once the other backends rely on the collector path.
  #
  # The endpoint MUST be OTLP/HTTP (port 4318 in our compose), not OTLP/gRPC (4317).
  # We deliberately use a Spring-specific env var (MANAGEMENT_OTLP_METRICS_EXPORT_URL)
  # instead of the generic OTEL_EXPORTER_OTLP_ENDPOINT, because that generic var is
  # conventionally gRPC and is consumed unchanged by the non-Spring backends
  # (Rust/Go) we'll add later.
  #
  # Spring Boot 4 gotcha: OtlpMetricsExportAutoConfiguration depends on
  # OpenTelemetryProperties, which lives in spring-boot-opentelemetry-autoconfigure
  # (pulled in by the spring-boot-starter-opentelemetry dependency in pom.xml).
  # Without that starter on the classpath, the OTLP registry silently no-ops even
  # when micrometer-registry-otlp is present.
  otlp:
    metrics:
      export:
        enabled: ${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:true}
        url: ${MANAGEMENT_OTLP_METRICS_EXPORT_URL:http://localhost:4318/v1/metrics}
        step: ${MANAGEMENT_OTLP_METRICS_EXPORT_STEP:10s}

logging:
  level:
    root: INFO
    com.chronomart: DEBUG
    com.azure.cosmos: INFO
    io.micrometer.registry.otlp: ${LOGGING_LEVEL_OTLP:INFO}
  file:
    name: ${CHRONOMART_LOG_FILE:logs/chronomart-java.log}
  logback:
    rollingpolicy:
      file-name-pattern: ${CHRONOMART_LOG_FILE:logs/chronomart-java.log}.%d{yyyy-MM-dd}.%i.gz
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB

chronomart:
  build:
    version: ${project.version:0.1.0-SNAPSHOT}
  cosmos:
    endpoint: ${COSMOS_ENDPOINT:https://localhost:8081/}
    key: ${COSMOS_KEY:C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==}
    database: ${COSMOS_DATABASE:ChronoMart}
    auth-mode: ${COSMOS_AUTH_MODE:key}
    allow-invalid-certs: ${COSMOS_ALLOW_INVALID_CERTS:false}
    emulator-host: ${COSMOS_EMULATOR_HOST:}
    container-init:
      enabled: ${CHRONOMART_CONTAINER_INIT_ENABLED:true}
      create-vector-container: ${CHRONOMART_CONTAINER_INIT_VECTOR:true}
