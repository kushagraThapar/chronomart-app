global:
  scrape_interval: 10s
  evaluation_interval: 30s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: gateway
    static_configs:
      - targets: ['gateway:8000']
    metrics_path: /metrics

  # Phase-1 backends — uncomment alongside the docker-compose entries
  - job_name: java-backend
    static_configs: [ { targets: ['java-backend:8101'] } ]
    metrics_path: /actuator/prometheus
  # - job_name: dotnet-backend
  #   static_configs: [ { targets: ['dotnet-backend:8102'] } ]
  #   metrics_path: /metrics
  # - job_name: python-backend
  #   static_configs: [ { targets: ['python-backend:8103'] } ]
  #   metrics_path: /metrics
